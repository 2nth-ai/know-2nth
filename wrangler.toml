# Cloudflare Pages configuration for know-2nth.
#
# Committed so every deploy (CI runs `wrangler pages deploy .`) attaches the
# same bindings. `pages_build_output_dir` marks this as a Pages config, which
# is what makes the `[ai]` binding apply to Pages Functions as `env.AI` —
# the Workers AI binding that powers /api/ask ("Ask Vince").
#
# Values mirror the live project config (from `wrangler pages download config`):
#   name = know-2nth, compatibility_date = 2026-04-14.
name = "know-2nth"
compatibility_date = "2026-04-14"
pages_build_output_dir = "."

# Workers AI — the edge LLM + embeddings binding Vinci calls via env.AI.run(...).
[ai]
binding = "AI"

# Vectorize — semantic retrieval index for Vinci (Phase 2). Populated by
# /api/reindex (bge-base-en-v1.5, 768-dim), queried by /api/ask. Account-level,
# so one populated index serves every deployment.
[[vectorize]]
binding = "VEC"
index_name = "know-tree"

# REINDEX_KEY is a Pages *secret* (not committed) that /api/reindex checks.
# Set it with: npx wrangler pages secret put REINDEX_KEY --project-name=know-2nth

# Jev (System One model) for the /lab/ demos, called from functions/api/lab/decide.ts.
# JEV_API_KEY is a Pages *secret* (not committed):
#   npx wrangler pages secret put JEV_API_KEY --project-name=know-2nth
# The Function calls TypeSafe's official endpoint by default. JEV_ENDPOINT and
# JEV_MODEL are optional overrides set in the Pages environment, never here.
