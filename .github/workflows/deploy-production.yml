name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pass an explicit ASCII commit message — Cloudflare's deployments API
          # rejects non-ASCII (em-dashes, middle-dots, curly quotes, arrows etc.)
          # with [code: 8000111]. Without --commit-message, wrangler reads HEAD's
          # raw commit message and we depend on commit-message hygiene we cannot
          # enforce. Use the short SHA + branch as a clean fallback.
          command: pages deploy . --project-name=know-2nth --branch=main --commit-dirty=true --commit-message="Auto-deploy main ${{ github.sha }}"
