name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=know-2nth --branch=${{ github.head_ref }} --commit-dirty=true

      - name: Post preview URL comment
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            // Cloudflare branch slug rules: alphanumeric + hyphens, 28 char max
            const slug = branch.replace(/[^a-z0-9-]/gi, '-').toLowerCase().substring(0, 28);
            const previewUrl = `https://${slug}.know-2nth.pages.dev`;

            const body = [
              '### 🔍 Preview Deploy',
              '',
              `**Preview URL:** ${previewUrl}`,
              '',
              'This preview updates on each push to this PR. Production deploy to `know.2nth.ai` runs automatically when this PR merges to `main`.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '### 🔍 Preview Deploy';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
